name: Build and run tests
on: [push, pull_request]
env:
  app_id: visualization.lactea
  lactea_tag: v0.2.2
  kodi_branch: Omega

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "GCC build"
            CC: gcc
            CXX: g++
          - name: "Clang build"
            CC: clang
            CXX: clang++
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
      # Kodi's addon framework does not forward -D options to the addon's own
      # configure step, so lactea is located through the environment.
      LACTEA_SOURCE_DIR: ${{ github.workspace }}/lactea
    steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install needed ubuntu depends
      run: |
        sudo apt-get update
        sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libgl-dev

    - name: Checkout Kodi repo
      uses: actions/checkout@v5
      with:
        repository: xbmc/xbmc
        ref: ${{ env.kodi_branch }}
        path: xbmc

    - name: Checkout lactea source
      uses: actions/checkout@v5
      with:
        repository: M0Rf30/lactea
        ref: ${{ env.lactea_tag }}
        path: lactea

    - name: Checkout ${{ env.app_id }} repo
      uses: actions/checkout@v5
      with:
        path: ${{ env.app_id }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          lactea/target
        key: lactea-${{ env.lactea_tag }}-${{ runner.os }}

    # The addon is not in Kodi's repo-binary-addons list; define it locally.
    - name: Prepare
      run: |
        mkdir -p xbmc/cmake/addons/addons/${app_id}
        echo ${app_id} ${{ github.workspace }}/${app_id} > xbmc/cmake/addons/addons/${app_id}/${app_id}.txt
        echo all > xbmc/cmake/addons/addons/${app_id}/platforms.txt

    - name: Configure
      run: |
        cmake -B ${app_id}/build \
              -DADDONS_TO_BUILD=${app_id} \
              -DADDON_SRC_PREFIX=${{ github.workspace }} \
              -DADDONS_DEFINITION_DIR=${{ github.workspace }}/xbmc/cmake/addons/addons \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/xbmc/addons \
              -DPACKAGE_ZIP=1 \
              ${{ github.workspace }}/xbmc/cmake/addons

    - name: Build
      run: make -C ${app_id}/build -j$(getconf _NPROCESSORS_ONLN)

    # Preset rotation against the real engine on the lavapipe software GPU
    # (exit code 77 = no GPU, treated as a failure here).
    - name: Preset rotation test
      run: |
        cd ${app_id}
        ${CXX} -std=c++17 -O1 -Isrc -I${LACTEA_SOURCE_DIR}/crates/lactea-capi/include \
            tests/preset_cycle.cpp src/LacteaPlayer.cpp \
            ${LACTEA_SOURCE_DIR}/target/release/liblactea_capi.a \
            -ldl -lpthread -lm -o preset_cycle
        ./preset_cycle

    - name: Package
      run: make -C ${app_id}/build package-${app_id}

    - name: Upload addon zip
      if: matrix.CC == 'gcc'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.app_id }}-linux-x86_64
        path: ${{ env.app_id }}/build/build/zips/${{ env.app_id }}+linux/*.zip

    # Tag pushes (vX.Y.Z) publish the installable zip on the GitHub release.
    - name: Attach zip to release
      if: matrix.CC == 'gcc' && startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.app_id }}/build/build/zips/${{ env.app_id }}+linux/*.zip
